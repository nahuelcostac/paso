name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  installer:
    uses: ./.github/workflows/windows.yml
    with:
      release-tag: ${{ github.ref_name }}

  publish:
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Paso-Windows-x64
          path: artifacts
      - name: Publish the installer on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          installer="artifacts/Paso-Setup-${RELEASE_TAG#v}-x64.exe"
          if [[ ! -f "$installer" ]]; then
            echo "Missing Windows installer $installer" >&2
            exit 1
          fi

          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" "$installer" --verify-tag --generate-notes \
            --notes 'The Windows installer is unsigned. If Windows SmartScreen blocks it, select **More info** → **Run anyway**.' \
            "${flags[@]}"
