name: Windows desktop

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''
      upload-app:
        description: Also upload the unpacked app (win-unpacked) for SignPath to sign.
        type: boolean
        default: false
    outputs:
      app-artifact-id:
        description: ID of the unpacked app artifact, when upload-app is set.
        value: ${{ jobs.installer.outputs.app-artifact-id }}

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    outputs:
      app-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check the release tag
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: node --input-type=module -e "import { validateReleaseTag } from './apps/desktop/version.mjs'; validateReleaseTag(process.env.RELEASE_TAG)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          VITEST_MAX_FORKS: '4'
      - run: pnpm build
      - run: pnpm --filter '@paso/desktop' package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Paso-Windows-x64
          path: apps/desktop/dist/release/Paso-Setup-*-x64.exe
          if-no-files-found: error
      - name: Upload the unpacked app for signing
        id: upload-app
        if: inputs.upload-app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Paso-Windows-x64-app-unsigned
          path: apps/desktop/dist/release/win-unpacked/
          if-no-files-found: error
          retention-days: 1
