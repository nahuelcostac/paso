name: Windows desktop

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Check the release tag
        if: inputs.release-tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: node --input-type=module -e "import { validateReleaseTag } from './apps/desktop/version.mjs'; validateReleaseTag(process.env.RELEASE_TAG)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          VITEST_MAX_FORKS: '4'
      - run: pnpm build
      - run: pnpm --filter '@paso/desktop' package
      - uses: actions/upload-artifact@v4
        with:
          name: Paso-Windows-x64
          path: apps/desktop/dist/release/Paso-Setup-*-x64.exe
          if-no-files-found: error
